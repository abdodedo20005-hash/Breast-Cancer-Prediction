name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/requirements-dev.txt
      - run: ruff check src tests app.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t breast-cancer-api .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api breast-cancer-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
